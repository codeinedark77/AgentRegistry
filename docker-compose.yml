# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# AgentRegistry — Production Docker Compose
#
# Services:
#   postgres   → PostgreSQL 16 (persistent volume)
#   backend    → FastAPI + Uvicorn (runs Alembic on startup)
#   frontend   → Next.js 14 standalone server
#
# Ollama runs on the HOST machine for GPU/hardware access.
# The backend reaches it via host.docker.internal:11434.
#
# Usage:
#   cp .env.example .env          # fill SECRET_KEY + passwords
#   docker compose up --build -d
#   docker compose logs -f
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: agentregistry

# ── Shared extension fields ──────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ar_postgres
    <<: *default-restart
    logging: *default-logging

    environment:
      POSTGRES_USER:     "${POSTGRES_USER:-agentregistry}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:       "${POSTGRES_DB:-agentregistry}"

      # Performance tuning for a dev/academic environment
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: place .sql seed files here
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:5433:5432"

    networks:
      - agentregistry-net

    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-agentregistry} -d ${POSTGRES_DB:-agentregistry}"
      interval:     10s
      timeout:      5s
      retries:      10
      start_period: 20s

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512m


  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
      target:     runtime
    image: agentregistry/backend:latest
    container_name: ar_backend
    <<: *default-restart
    logging: *default-logging

    environment:
      # ── Database ──────────────────────────────────────────────────
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-agentregistry}:${POSTGRES_PASSWORD}@ar_postgres:5432/${POSTGRES_DB:-agentregistry}"

      # ── JWT ───────────────────────────────────────────────────────
      SECRET_KEY:                  "${SECRET_KEY}"
      ALGORITHM:                   "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"

      # ── App ───────────────────────────────────────────────────────
      DEBUG:           "false"
      LOG_LEVEL:       "info"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"

      # ── CORS ──────────────────────────────────────────────────────
      # Accepts requests from the Next.js frontend container
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://frontend:3000"]'

      # ── Ollama (host machine) ──────────────────────────────────────
      # On Linux: host.docker.internal resolves via extra_hosts below
      # On Docker Desktop (Mac/Win): this works natively
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - agentregistry-net

    # Allow backend container to reach Ollama on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/api/docs
      interval:     30s
      timeout:      10s
      retries:      5
      start_period: 45s    # Allow time for migrations

    deploy:
      resources:
        limits:
          memory: 512m


  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      target:     runner
      args:
        # Baked into the JS bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: agentregistry/frontend:latest
    container_name: ar_frontend
    <<: *default-restart
    logging: *default-logging

    environment:
      NODE_ENV:            production
      PORT:                3000
      # Runtime env (not baked — used by server-side code only)
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"

    ports:
      - "0.0.0.0:3001:3000" # Map host 3001 to container 3000   # Publicly accessible

    networks:
      - agentregistry-net

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/
      interval:     30s
      timeout:      10s
      retries:      3
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512m


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  postgres_data:
    driver: local
    labels:
      com.agentregistry.description: "PostgreSQL persistent data volume"


networks:
  agentregistry-net:
    driver: bridge
    labels:
      com.agentregistry.description: "Internal bridge network for all services"